<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="agent-hub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202a3d"/>
      <stop offset="1" stop-color="#0b1019"/>
    </linearGradient>
    <radialGradient id="core" cx="0.34" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#9cf7ce"/>
      <stop offset="0.55" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#12966c"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa3ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <path d="M0 30Q0 0 30 0h68Q128 0 128 30v6H0z" fill="#ffffff" opacity="0.045"/>

  <!-- hub links -->
  <g stroke="url(#edge)" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M64 64 34 33"/>
    <path d="M64 64 94 33"/>
    <path d="M64 64 34 95"/>
    <path d="M64 64 94 95"/>
  </g>

  <!-- satellites -->
  <g fill="#162030" stroke-width="2.6">
    <circle cx="34" cy="33" r="9.5" stroke="#5ea5fa"/>
    <circle cx="94" cy="33" r="9.5" stroke="#8a97ff"/>
    <circle cx="34" cy="95" r="9.5" stroke="#3ddc97"/>
    <circle cx="94" cy="95" r="9.5" stroke="#ffc24d"/>
  </g>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="34" cy="33" r="2.6"/>
    <circle cx="94" cy="33" r="2.6"/>
    <circle cx="34" cy="95" r="2.6"/>
    <circle cx="94" cy="95" r="2.6"/>
  </g>

  <!-- center hub -->
  <circle cx="64" cy="64" r="25" fill="#3ddc97" opacity="0.28" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="22" fill="#0d1622" stroke="#3ddc97" stroke-width="1.6" opacity="0.9"/>
  <circle cx="64" cy="64" r="14.5" fill="url(#core)"/>
  <circle cx="59" cy="59" r="4.6" fill="#ffffff" opacity="0.55"/>
</svg>
