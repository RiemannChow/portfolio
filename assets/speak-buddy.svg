<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="SpeakBuddy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b53e8"/>
      <stop offset="1" stop-color="#2a1f7a"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#d8d4ff" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b83ff"/>
      <stop offset="0.5" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#8b83ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <path d="M0 30Q0 0 30 0h68Q128 0 128 30v6H0z" fill="#ffffff" opacity="0.05"/>

  <!-- soft halo behind the bubble -->
  <ellipse cx="64" cy="60" rx="38" ry="31" fill="#a9a2ff" opacity="0.32" filter="url(#glow)"/>

  <!-- speech bubble -->
  <path d="M30 36h68a10 10 0 0 1 10 10v38a10 10 0 0 1-10 10H61L40 106V94h-10a10 10 0 0 1-10-10V46a10 10 0 0 1 10-10z" fill="url(#bubble)"/>

  <!-- waveform / pronunciation bars -->
  <g fill="url(#wave)" stroke="none">
    <rect x="48" y="52" width="6" height="20" rx="3"/>
    <rect x="59" y="45" width="6" height="34" rx="3"/>
    <rect x="70" y="49" width="6" height="26" rx="3"/>
    <rect x="81" y="56" width="6" height="12" rx="3"/>
  </g>

  <!-- little "correct" spark -->
  <path d="m92 28 3.2 7 7.3 1-5.3 5.1 1.3 7.3-6.5-3.5-6.5 3.5 1.3-7.3-5.3-5.1 7.3-1z" fill="#ffc24d" opacity="0.95"/>
</svg>
