<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="GroveMQ">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174a37"/>
      <stop offset="1" stop-color="#07231a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#a8f0c6"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffe6a8"/>
      <stop offset="1" stop-color="#ffb627"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <path d="M0 30Q0 0 30 0h68Q128 0 128 30v6H0z" fill="#ffffff" opacity="0.05"/>

  <!-- broadcast waves -->
  <g fill="none" stroke="#ffc24d" stroke-linecap="round">
    <path d="M38 50a34 34 0 0 1 52 0" stroke-width="3.4" opacity="0.95"/>
    <path d="M27 42a48 48 0 0 1 74 0" stroke-width="3.2" opacity="0.55"/>
    <path d="M17 34a62 62 0 0 1 94 0" stroke-width="2.8" opacity="0.26"/>
  </g>

  <!-- broker trunk / node -->
  <rect x="55" y="66" width="18" height="18" rx="5" fill="#0b2c20" stroke="#3ddc97" stroke-width="2"/>
  <path d="M64 84v18" stroke="url(#leaf)" stroke-width="4" stroke-linecap="round"/>
  <path d="M64 92c-9 0-13-5-15-11 8-1 13 3 15 11z" fill="url(#leaf)" opacity="0.9"/>
  <path d="M64 96c9 0 13-5 15-11-8-1-13 3-15 11z" fill="url(#leaf)" opacity="0.72"/>

  <circle cx="64" cy="75" r="13" fill="#ffc24d" opacity="0.35" filter="url(#glow)"/>
  <circle cx="64" cy="75" r="5.5" fill="url(#sun)"/>

  <!-- client endpoints -->
  <g fill="#ffd06b">
    <circle cx="27" cy="42" r="4"/>
    <circle cx="101" cy="42" r="4"/>
    <circle cx="17" cy="34" r="3" opacity="0.5"/>
    <circle cx="111" cy="34" r="3" opacity="0.5"/>
  </g>
</svg>
